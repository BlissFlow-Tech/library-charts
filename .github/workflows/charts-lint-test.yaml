name: "Charts: Lint and test"

# Runs on every PR (not path-filtered) because its jobs are required status
# checks on main; lint/install skip themselves when no chart changed.
# workflow_dispatch lets the release workflow run it on release-please PRs,
# which don't trigger pull_request events.
on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint charts
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.3

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up chart-testing
      uses: helm/chart-testing-action@v2.8.0

    - name: Run chart-testing (list-changed)
      id: list-changed
      run: |
        changed=$(ct list-changed --config .github/ct-lint.yaml)
        if [[ -n "$changed" ]]; then
         echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Run chart-testing (lint)
      id: lint
      if: steps.list-changed.outputs.changed == 'true'
      run: ct lint --config .github/ct-lint.yaml

  unittest:
    needs:
    - lint
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.3

    - name: Run tests
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2
        cd helper-charts/common-test/
        helm unittest -f "tests/**/*_test.yaml" .

  install:
    needs:
    - lint
    name: Install charts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.17.3

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up chart-testing
      uses: helm/chart-testing-action@v2.8.0

    - name: Create k3d cluster
      uses: nolar/setup-k3d-k3s@v1.1.0
      with:
        version: v1.33.0+k3s1
      if: needs.lint.outputs.changed == 'true'

    - name: Run chart-testing (install)
      run: ct install --config .github/ct-install.yaml
      if: needs.lint.outputs.changed == 'true'
