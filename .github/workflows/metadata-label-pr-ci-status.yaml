name: Label PRs based on CI status
on:
  workflow_run:
    workflows:
      - 'Pre‑commit consistency check'
      - 'Charts: Lint and test'
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Label CI status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!['success', 'failure'].includes(run.conclusion)) return;

            const prefix = run.name === 'Charts: Lint and test' ? 'lint' : 'precommit';
            const ok = run.conclusion === 'success';
            const add = `${prefix}:${ok ? 'ok' : 'failed'}`;
            const remove = `${prefix}:${ok ? 'failed' : 'ok'}`;

            // Empty for runs that weren't triggered by a same-repo PR
            for (const pr of run.pull_requests) {
              const issue_number = pr.number;
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [add] });
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: remove });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
