name: "Charts: Release"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/release-please-config.json'
      - '.github/.release-please-manifest.json'

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['charts/stable/common--release_created'] }}
      tag_name: ${{ steps.release.outputs['charts/stable/common--tag_name'] }}
    steps:
      # Opens/updates a release PR that bumps Chart.yaml and CHANGELOG.md from
      # Conventional Commit messages; merging it creates the tag and GitHub release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Checkout release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}

      # main is protected, so the README (version badge, values table) is
      # regenerated in the release PR instead of being pushed to main.
      - name: Regenerate chart README
        if: steps.release.outputs.prs_created == 'true'
        run: |
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz | tar xz helm-docs
          sudo mv helm-docs /usr/local/bin/
          ./hack/gen-helm-docs.sh stable common

      - name: Commit README to release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate chart README"
          file_pattern: charts/**/README.md
          commit_user_name: github-actions
          commit_user_email: github-actions@github.com

      # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows, so
      # run the required checks on the release PR explicitly.
      # Step env is evaluated even when `if` skips the step, and `pr` is empty
      # when no release PR was touched, hence the '{}' fallback.
      - name: Run required checks on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          gh workflow run charts-lint-test.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run pre-commit-check.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  publish:
    name: Publish chart
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Package chart and attach it to the release
        run: |
          helm package charts/stable/common --destination .packages
          gh release upload "$TAG" .packages/*.tgz --clobber

      - name: Update Helm repository index on gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          helm repo index .packages \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --merge gh-pages/index.yaml
          cp .packages/index.yaml gh-pages/index.yaml
          cd gh-pages
          git add index.yaml
          git commit -m "Release ${TAG}"
          git push origin HEAD:gh-pages
