name: "Charts: Release"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

jobs:
  readme:
    name: Regenerate chart READMEs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full git history
          ref: ${{ github.ref }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: shell
          filters: |
            addedOrModified:
              - added|modified: 'charts/**'

      - name: Install helm-docs
        run: |
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz | tar xz
          sudo mv helm-docs /usr/local/bin/

      - name: Regenerate READMEs for changed charts
        if: steps.filter.outputs.addedOrModified == 'true'
        run: |
          echo "🔍 Detecting changed chart paths..."
          CHARTS=()
          PATHS=(${{ steps.filter.outputs.addedOrModified_files }})
          echo "Detected changed files: ${PATHS[@]}"
          for i in "${PATHS[@]}"
          do
              if [[ "$i" != charts/* ]]; then
                  continue
              fi
              IFS='/' read -r -a path_parts <<< "$i"
              if [[ ${#path_parts[@]} -lt 3 ]]; then
                  continue
              fi
              CHART_PATH="${path_parts[1]}/${path_parts[2]}"
              CHARTS+=("$CHART_PATH")
          done

          CHARTS=( $(printf "%s\n" "${CHARTS[@]}" | sort -u) )

          echo "📦 Changed charts:"
          for i in "${CHARTS[@]}"; do
            echo " - $i"
          done

          for i in "${CHARTS[@]}"
          do
              IFS='/' read -r -a chart_parts <<< "$i"
              CATEGORY="${chart_parts[0]}"
              NAME="${chart_parts[1]}"
              CHART_DIR="charts/${CATEGORY}/${NAME}"
              if [ -f "${CHART_DIR}/Chart.yaml" ]; then
                echo "📄 Generating docs for chart: ${CATEGORY}/${NAME}"
                ./hack/gen-helm-docs.sh "${CATEGORY}" "${NAME}"
              else
                echo "❌ Chart.yaml not found for ${CATEGORY}/${NAME}, skipping."
              fi
          done

      - name: Commit and push README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-generate chart README [no ci]
          file_pattern: charts/**/README.md
          commit_user_name: github-actions
          commit_user_email: github-actions@github.com

  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['charts/stable/common--release_created'] }}
      tag_name: ${{ steps.release.outputs['charts/stable/common--tag_name'] }}
    steps:
      # Opens/updates a release PR that bumps Chart.yaml and CHANGELOG.md from
      # Conventional Commit messages; merging it creates the tag and GitHub release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish chart
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package chart and attach it to the release
        run: |
          helm package charts/stable/common --destination .packages
          gh release upload "$TAG" .packages/*.tgz --clobber

      - name: Update Helm repository index on gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          helm repo index .packages \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --merge gh-pages/index.yaml
          cp .packages/index.yaml gh-pages/index.yaml
          cd gh-pages
          git add index.yaml
          git commit -m "Release ${TAG}"
          git push origin HEAD:gh-pages
